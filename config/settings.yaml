# Global Portfolio Settings
portfolio:
  initial_capital: 1000000  # KRW (100만원)
  base_currency: KRW

# Risk Hard Limits
risk:
  max_portfolio_drawdown: 0.20       # 20% → 전 포지션 50% 감소
  max_single_position: 0.15          # 15% → 주문 거부
  max_strategy_allocation: 0.40      # 40% → 주문 거부
  daily_var_95: 0.02                 # 2% → 경고 + 신규 주문 중단
  per_trade_stop_loss: 0.03          # 3% → 기계적 청산
  max_leverage: 1.0                  # 무레버리지

# Strategy Allocation
allocation:
  crypto_momentum: 0.35              # 35% (~350,000 KRW)
  etf_mean_reversion: 0.35           # 35% (~350,000 KRW)
  dual_momentum: 0.30                # 30% (~300,000 KRW)

# Scheduling
schedule:
  weekly_rebalance_day: monday       # 주간 리밸런싱 요일
  monthly_rebalance_day: 1           # 월간 리밸런싱 일
  market_check_interval_minutes: 60  # 시장 체크 간격

# Data
data:
  cache_ttl_seconds: 3600            # 1시간 캐시
  ohlcv_interval: day                # 일봉 기본
  sqlite_path: data/hedgefund.db

# Monitoring
monitoring:
  log_level: INFO
  log_format: json
  health_check_interval_minutes: 30
  telegram:
    enabled: true
    bot_token: "REDACTED_TOKEN"
    chat_id: "REDACTED_CHAT_ID"
