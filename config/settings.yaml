# Global Portfolio Settings
portfolio:
  initial_capital: 13000000  # KRW (~$10,000)
  base_currency: KRW

# Risk Hard Limits
risk:
  max_portfolio_drawdown: 0.20       # 20% → 전 포지션 50% 감소
  max_single_position: 0.15          # 15% → 주문 거부
  max_strategy_allocation: 0.40      # 40% → 주문 거부
  max_symbol_exposure: 0.20          # 20% → 교차 전략 심볼 합산 한도
  daily_var_95: 0.02                 # 2% → 경고 + 신규 주문 중단
  per_trade_stop_loss: 0.05          # 5% → 기계적 청산 (코인 변동성 고려 상향)
  max_leverage: 1.0                  # 무레버리지 (인버스 ETF는 매수이므로 레버리지 아님)

# Strategy Allocation (합계 ≤ 1.0, 나머지는 현금 버퍼)
allocation:
  crypto_momentum: 0.10              # 10% (~$1,000) — 비용 드래그 감소
  etf_mean_reversion: 0.40           # 40% (max_strategy_allocation) — alpha 극대화
  dual_momentum: 0.10                # 10% — beta 기여 감소
  market_hedge: 0.0                  # NO-GO: SPY+SH 충돌, 변동성 감쇠
  treasury_park: 0.30                # 30% → BIL 단기국채 ETF (무위험 수익)
  pairs_trading: 0.0                 # 비활성 — alpha 확보 후 재활성화
  # 나머지 10% (~$1,000) = 현금 버퍼 (긴급 리밸런싱 여유)

# Beta Hedge Overlay (포트폴리오 레벨 시장 중립화)
beta_hedge:
  enabled: true                       # 활성화
  benchmark: SPY                      # 헤지 벤치마크
  window: 90                          # 롤링 베타 윈도우 (거래일)
  min_periods: 20                     # 최소 데이터 포인트
  max_hedge_ratio: 0.30               # 최대 헤지 비율 (SPY short 상한)

# Scheduling
schedule:
  weekly_rebalance_day: monday       # 주간 리밸런싱 요일
  monthly_rebalance_day: 1           # 월간 리밸런싱 일
  market_check_interval_minutes: 60  # 시장 체크 간격

# Data
data:
  cache_ttl_seconds: 3600            # 1시간 캐시
  ohlcv_interval: day                # 일봉 기본
  sqlite_path: data/hedgefund.db

# Monitoring
monitoring:
  log_level: INFO
  log_format: json
  health_check_interval_minutes: 30
  telegram:
    enabled: true
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
