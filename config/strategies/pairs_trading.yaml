name: pairs_trading
exchange: alpaca
market: US
rebalance_frequency: weekly

parameters:
  lookback_days: 60
  holding_days: 5
  zscore_entry: 2.0
  zscore_exit: 0.5
  hedge_ratio_window: 60

# Cointegrated ETF pairs (evaluator-available symbols)
# SPY/QQQ: large-cap equity vs tech-heavy (r > 0.90)
# TLT/IEF: long-term vs intermediate treasury (same yield curve)
pairs:
  - SPY,QQQ
  - TLT,IEF

costs:
  commission_rate: 0.0
  slippage_rate: 0.001

validation:
  min_sharpe: 0.8
  max_drawdown: 0.20
  min_profit_factor: 1.3
