[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hedgefund"
version = "0.1.0"
description = "Small-capital quantitative hedge fund system"
requires-python = ">=3.11"
dependencies = [
    "pyupbit>=0.2.33",
    "alpaca-trade-api>=3.0.0",
    "yfinance>=0.2.36",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pandas-stubs>=2.1.0",
]

[project.scripts]
hedgefund = "hedgefund.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hedgefund"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pyupbit.*", "alpaca_trade_api.*", "yfinance.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["hedgefund"]

[tool.coverage.report]
fail_under = 80
show_missing = true
omit = [
    "src/hedgefund/data/providers/*",  # external API — integration tests
    "src/hedgefund/data/protocols.py",  # protocol definition only
]
